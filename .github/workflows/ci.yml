name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    # A test that hangs fails the job instead of holding the runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Layers
        run: cargo xtask check-layers
      - name: Changelog
        if: runner.os == 'Linux'
        run: cargo xtask check-changelog
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The hosted Linux image ships Chrome; the sign-in test opens it headless.
          ITDA_TEST_BROWSER: ${{ runner.os == 'Linux' && '/usr/bin/google-chrome' || '' }}
