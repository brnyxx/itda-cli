<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>itda banner</title>
<!--
  Renders assets/social.png, assets/hero.png and assets/hero.ko.png from
  assets/handoff.png. From the repository root:

    sh assets/src/banner.sh

  ?v=social is 1280x640 (the link preview); ?v=hero is 1600x700, captured at
  2x; &lang=ko switches the words.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Schibsted+Grotesk:wght@400;500&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #070A12; --text: #ECEEF3; --muted: #9AA3B5; --blue-hi: #6E8BFF;
    --display: "Bricolage Grotesque", "Noto Sans KR", sans-serif;
    --sans: "Schibsted Grotesk", "Noto Sans KR", sans-serif;
  }
  html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--sans); }
  .frame { position: relative; width: 1280px; height: 640px; overflow: hidden; background: var(--ink); }
  .frame.hero { width: 1600px; height: 700px; }
  .glow {
    position: absolute; width: 1100px; height: 700px; right: -260px; top: -200px;
    background: radial-gradient(closest-side, rgba(47, 91, 234, .34), rgba(110, 139, 255, .10) 55%, transparent);
    filter: blur(24px);
  }
  .art {
    position: absolute; right: -70px; top: 50%; transform: translateY(-50%); height: 104%; width: auto;
    mask-image: linear-gradient(90deg, transparent, #000 28%);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 28%);
  }
  .hero .art { right: -40px; height: 106%; }
  .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 500px; }
  .hero .copy { left: 96px; width: 620px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { height: 36px; }
  h1 {
    margin: 0 0 18px; font: 700 56px/1.02 var(--display); letter-spacing: -.035em;
    font-variation-settings: "opsz" 96;
  }
  .hero h1 { font-size: 66px; }
  html[lang="ko"] h1 { font-size: 52px; letter-spacing: -.03em; line-height: 1.15; word-break: keep-all; }
  html[lang="ko"] .hero h1 { font-size: 60px; }
  h1 em { font-style: normal; color: var(--blue-hi); }
  p { margin: 0; font: 400 21px/1.45 var(--sans); color: var(--muted); max-width: 460px; }
  .hero p { font-size: 24px; max-width: 560px; }
  html[lang="ko"] p { word-break: keep-all; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="glow"></div>
  <img class="art" src="../handoff.png" alt="">
  <div class="copy">
    <div class="brand"><img src="../wordmark-dark.svg" alt="itda"></div>
    <h1 id="h1">The websites you use,<br><em>handed to your AI.</em></h1>
    <p id="p">One address in. A short list of things your agent can do out. Reads just work, changes wait for your yes, and it all runs on your own computer.</p>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("v") === "hero") document.getElementById("frame").classList.add("hero");
  if (q.get("lang") === "ko") {
    document.documentElement.lang = "ko";
    document.getElementById("h1").innerHTML = "내가 쓰는 웹사이트를<br><em>AI에게 넘겨주세요.</em>";
    document.getElementById("p").textContent = "주소 하나를 넣으면, 에이전트가 할 수 있는 일의 짧은 목록이 나옵니다. 읽기는 알아서 되고, 변경은 내 허락을 기다리고, 전부 내 컴퓨터에서 돌아갑니다.";
  }
</script>
</body>
</html>
