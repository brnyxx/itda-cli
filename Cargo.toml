[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
itda-types = { path = "crates/types" }
itda-html = { path = "crates/html" }
itda-spec = { path = "crates/spec" }
itda-policy = { path = "crates/policy" }

chrono = { version = "0.4.45", features = ["serde"] }
graphql-parser = "0.4.1"
psl = "2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled-full"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
