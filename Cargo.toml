[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
itda-types = { path = "crates/types" }
itda-html = { path = "crates/html" }
itda-store = { path = "crates/store" }
itda-spec = { path = "crates/spec" }
itda-policy = { path = "crates/policy" }
itda-net = { path = "crates/net" }
itda-vault = { path = "crates/vault" }
itda-runtime = { path = "crates/runtime" }
itda-mcp = { path = "crates/mcp" }

axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
graphql-parser = "0.4.1"
httpdate = "1.0.3"
keyring = "4.2.0"
psl = "2"
regex = "1.13.1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled-full"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
