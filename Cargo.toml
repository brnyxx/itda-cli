[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
itda-types = { path = "crates/types" }

rusqlite = { version = "0.40.2", features = ["bundled-full"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
