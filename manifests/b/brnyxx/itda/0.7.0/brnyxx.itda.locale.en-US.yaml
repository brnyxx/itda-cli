ShortDescription: Named actions on the websites you use, for your AI agent. Reads just work; changes wait for your approval.
Description: |-
  Give itda the address of a site you use. It looks at the site, names what it can do in plain words, tries every read once and hands your agent a short list of actions over MCP. Reads run right away, and a read a site answers with a challenge page can recover in the browser installed on your computer. A change never runs until you approve it in your terminal, it is sent once, and everything agents did is in a hash-chained audit log. When setup comes up short, your agent can prepare the site from its docs without seeing what the site holds.
