[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# What the shell and PowerShell installers say at the end
install-success-msg = "itda is installed. Open a new terminal window and type: itda"
# Start releases from the Actions tab; the workflow creates the tag
dispatch-releases = true

# One MCP Bundle per platform for Claude Desktop, packed from the archives above
# once every platform has built (cargo xtask mcpb, xtask/src/mcpb.rs)
[[dist.extra-artifacts]]
artifacts = [
  "target/mcpb/itda-aarch64-apple-darwin.mcpb",
  "target/mcpb/itda-aarch64-unknown-linux-gnu.mcpb",
  "target/mcpb/itda-x86_64-apple-darwin.mcpb",
  "target/mcpb/itda-x86_64-unknown-linux-gnu.mcpb",
  "target/mcpb/itda-x86_64-pc-windows-msvc.mcpb",
]
build = ["cargo", "xtask", "mcpb"]
