<!doctype html>
<html>
<head>
  <title>Notice board - Example intranet</title>
  <link rel="alternate" type="application/rss+xml" title="Notices" href="/board/feed.xml">
</head>
<body>
  <h1>Notices</h1>
  <form action="/board/search" method="get">
    <input type="hidden" name="board_id" value="7">
    <input name="q" required>
    <select name="sort"><option>new</option><option>old</option></select>
    <input type="submit" value="Search">
  </form>
  <table class="list">
    <thead><tr><th>No</th><th>Title</th><th>Author</th><th>Posted on</th></tr></thead>
    <tbody>
      <tr><td>42</td><td><a href="/board/42">Server maintenance</a></td><td>ops</td><td>2026-10-20</td></tr>
      <tr><td>41</td><td><a href="/board/41">Parking lot closed</a></td><td>admin</td><td>2026-10-19</td></tr>
      <tr><td>40</td><td><a href="/board/40">Welcome</a></td><td>admin</td><td>2026-10-18</td></tr>
    </tbody>
  </table>
  <nav><a href="/board?page=2">2</a> <a href="/board?page=3">3</a></nav>
  <form action="/board/write" method="post">
    <input type="hidden" name="_csrf" value="recorded-secret-token">
    <input type="hidden" name="board_id" value="7">
    <input name="title" required>
    <textarea name="body"></textarea>
    <button type="submit">Post</button>
  </form>
  <form action="/login" method="post">
    <input name="user">
    <input type="password" name="pw">
  </form>
</body>
</html>
