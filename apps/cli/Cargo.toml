[package]
name = "itda-cli"
description = "The itda command: list sites, call actions, manage accounts and check the setup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "itda"
path = "src/main.rs"

[dependencies]
itda-types = { workspace = true }
itda-spec.workspace = true
itda-policy.workspace = true
itda-store.workspace = true
itda-net.workspace = true
itda-vault.workspace = true
itda-browser.workspace = true
itda-runtime.workspace = true
itda-mcp.workspace = true
itda-prep.workspace = true
clap.workspace = true
serde_json.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
axum.workspace = true
tokio.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true
# Apache-2.0 requires the NOTICE file to travel with the binary.
include = ["../../NOTICE"]
